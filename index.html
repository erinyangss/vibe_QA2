eature p{color:var(--muted);line-height:1.7;margin:0;font-size:14px}.panel{max-width:760px;margin:0 auto}.panel.wide{max-width:1030px}.page-title{font-size:31px;margin:7px 0 12px}.subtle{color:var(--muted);line-height:1.8}.field{display:grid;gap:8px;margin:18px 0}.field label{font-weight:700;font-size:14px}.field input,.field textarea,.field select{background:#0c1527;color:#f0f5ff;border:1px solid #35435e;border-radius:12px;padding:13px 14px;width:100%}.field textarea{resize:vertical;min-height:95px}.field small{color:var(--muted)}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.row.between{justify-content:space-between}.split{display:grid;grid-template-columns:1fr 1fr;gap:16px}.notice{padding:14px 17px;border-radius:13px;background:#4e47a42a;color:#d9d4ff;border:1px solid #8880ff4f;line-height:1.7;font-size:14px;margin:17px 0}.notice.warn{background:#5a461e44;color:#ffe4aa;border-color:#ad85394f}.notice.success{background:#18534344;color:#a1f0d0;border-color:#42b68e66}.progress{height:9px;border-radius:20px;background:#2c3853;overflow:hidden;margin:12px 0 23px}.progress>div{height:100%;background:linear-gradient(90deg,#8076f0,#54d6c9);transition:width .25s}.question-title{font-size:clamp(21px,3vw,30px);line-height:1.55;margin:20px 0}.options{display:grid;gap:12px;margin:20px 0}.option{display:flex;gap:14px;align-items:center;padding:17px 19px;text-align:left;color:var(--text);border-radius:14px;background:#17253e;border:1px solid #34435e;width:100%;transition:.18s}.option:hover{border-color:#8a82e3;background:#223250}.option.selected{border-color:#a49aff;background:#413b7859;box-shadow:inset 0 0 0 1px #a49aff}.option .letter{width:30px;height:30px;background:#2c3b58;border-radius:9px;display:grid;place-items:center;flex-shrink:0}.question-image{max-height:230px;max-width:100%;border-radius:14px;object-fit:contain;background:#fff}.table-wrap{overflow:auto}.leaderboard{width:100%;border-collapse:collapse;min-width:600px}.leaderboard th{text-align:left;color:#a5b4ca;font-size:12px;letter-spacing:.5px;font-weight:700}.leaderboard th,.leaderboard td{border-bottom:1px solid #31405a;padding:15px 12px}.leaderboard tr:last-child td{border-bottom:0}.leaderboard td strong{color:#f0f4ff}.rank{display:inline-flex;align-items:center;justify-content:center;border-radius:10px;min-width:36px;height:34px;background:#2b3a57}.rank.first{background:#51401e;color:#ffdb87}.empty{text-align:center;color:var(--muted);padding:40px 10px}.admin-grid{display:grid;grid-template-columns:240px 1fr;gap:18px}.admin-side{display:flex;flex-direction:column;gap:6px;align-self:start}.admin-side button{border:0;border-radius:10px;background:transparent;color:var(--muted);padding:13px;text-align:left}.admin-side button.active{background:#41407866;color:#fff}.admin-section{min-width:0}.table-actions{display:flex;gap:6px;flex-wrap:wrap}.item{background:#0c1629;padding:17px;border:1px solid #34405a;border-radius:13px;margin:10px 0}.item .small{font-size:12px;color:var(--muted)}.separator{border:0;border-top:1px solid #30405b;margin:25px 0}.footer{color:#8192ad;font-size:12px;text-align:center;border-top:1px solid #ffffff14;padding:19px}.toast{position:fixed;bottom:22px;right:20px;z-index:100;background:#2b3853;border:1px solid #586986;color:#fff;border-radius:14px;padding:14px 18px;box-shadow:var(--shadow);max-width:min(90vw,400px)}.hidden{display:none!important}.countdown{color:var(--warn);font-weight:850;font-variant-numeric:tabular-nums}.medal{font-size:55px}.check-list{padding-left:20px;color:var(--muted);line-height:2}.demo-stamp{background:#ffce731c;border:1px solid #ffce7355;color:#ffe1a4;border-radius:11px;padding:10px 14px;font-size:12px}.caption{font-size:12px;color:var(--muted)}@keyframes float{50%{transform:translateY(-11px)}}@media(max-width:850px){.hero{grid-template-columns:1fr}.hero-copy{padding:15px 0}.grid3{grid-template-columns:1fr}.admin-grid{grid-template-columns:1fr}.admin-side{flex-direction:row;overflow:auto}.admin-side button{white-space:nowrap}}@media(max-width:540px){.shell{padding:15px}.logo{font-size:18px}.main{padding-top:22px}.card{padding:19px;border-radius:18px}.hero h1{letter-spacing:-1px}.stats{gap:19px}.split{grid-template-columns:1fr}.nav button{padding:9px 10px;font-size:13px}.prize-art{min-height:255px}.prize-icon{font-size:82px}.option{padding:14px}.page-title{font-size:26px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.option.correct-answer{border-color:#4ee0a3!important;background:#185343!important;box-shadow:inset 0 0 0 1px #4ee0a3}.option.wrong-answer{border-color:#ff8c9f!important;background:#603144!important}.option:disabled{cursor:default;opacity:1}.answer-feedback{border-radius:14px;padding:16px 18px;margin:16px 0;font-weight:750;line-height:1.75}.answer-feedback.good{background:#18534366;border:1px solid #4ee0a377;color:#a1f0d0}.answer-feedback.bad{background:#60314477;border:1px solid #ff8c9f77;color:#ffd2db}.score-chip{color:#a1f0d0;font-weight:800}

<body>
<div class="shell"><header class="top"><div class="logo"><div class="logo-mark">✦</div><span>Quiz<span style="color:#a89fff">Arena</span></span></div><nav class="nav" id="nav"><button data-page="home">首頁</button><button data-page="play">參加競賽</button><button data-page="board">排行榜</button><button data-page="prize">獎品</button><button data-page="admin">管理後台</button></nav><div class="account"><span id="who" class="tag">訪客</span><button class="btn sm secondary hidden" id="logout">退出</button></div></header><main class="main" id="app" aria-live="polite"></main><footer class="footer">QuizArena · 單一 HTML 整合原型 · 玩家資料僅儲存於此瀏覽器 · 無跨裝置同步與正式發獎</footer></div><div class="toast hidden" id="toast" role="status"></div>
<script>
'use strict';
/* 第一階段：純本機 DEMO。所有資料均不具備防竄改能力，不得用來發放真獎品。 */
const KEY='quizarena_demo_v2_feedback', AUTH='quizarena_session_v1', INVITE_CODE='STAR2026';
// 僅本機原型：雜湊驗證無法防止使用者修改前端程式或瀏覽器儲存空間。
const ADMIN_PASSWORD_SHA256='2a31c345b4719e1fad06582a86960d247dda1a8d9928bfed30967277bd28b5e3';
const defaultQuestions=[
  {"id": "q1", "type": "choice", "text": "台灣最高的山是哪一座？", "options": ["玉山", "雪山", "合歡山", "阿里山"], "answer": 0},
  {"id": "q2", "type": "choice", "text": "HTML 主要負責網站的哪一部分？", "options": ["內容與結構", "資料庫備份", "伺服器供電", "網路線路"], "answer": 0},
  {"id": "q3", "type": "choice", "text": "JavaScript 常用來實現哪一項功能？", "options": ["網頁按鈕互動", "製造電腦晶片", "傳輸電力", "替換螢幕"], "answer": 0},
  {"id": "q4", "type": "choice", "text": "下列哪一個是常見的程式語言？", "options": ["Python", "JPEG", "MP4", "PNG"], "answer": 0},
  {"id": "q5", "type": "choice", "text": "一公里等於多少公尺？", "options": ["100", "1000", "10000", "10"], "answer": 1}
];
const defaultTies=[
  {"id": "t1", "type": "choice", "text": "CSS 最常用於設定什麼？", "options": ["網頁樣式", "電腦散熱", "硬碟容量", "使用者密碼"], "answer": 0},
  {"id": "t2", "type": "choice", "text": "下列哪個是電腦運算裝置？", "options": ["GPU", "HTML", "CSS", "URL"], "answer": 0},
  {"id": "t3", "type": "choice", "text": "下列哪個標籤通常用於 HTML 的主要標題？", "options": ["<h1>", "<img>", "<br>", "<input>"], "answer": 0},
  {"id": "t4", "type": "choice", "text": "如果二進位數字是 101，十進位是多少？", "options": ["4", "5", "6", "7"], "answer": 1},
  {"id": "t5", "type": "choice", "text": "下列何者較適合儲存多人競賽成績？", "options": ["資料庫", "螢幕截圖", "CSS", "電腦桌布"], "answer": 0},
  {"id": "t6", "type": "choice", "text": "下列何者是標準網頁的安全傳輸協定？", "options": ["HTTP", "HTTPS", "FTP", "SMTP"], "answer": 1},
  {"id": "t7", "type": "choice", "text": "在 JavaScript 中，5 + 3 的結果是？", "options": ["8", "53", "2", "15"], "answer": 0},
  {"id": "t8", "type": "choice", "text": "下列哪個單位通常用來表示資料大小？", "options": ["公尺", "秒", "GB", "攝氏度"], "answer": 2}
];
const defaults=()=>({name:'星際知識挑戰賽',invite:INVITE_CODE,prize:'神秘電子禮券',prizeDescription:'冠軍可獲得主辦人準備的電子獎品（示範版不提供真實兌換碼）。',questionCount:5,tieCount:2,shuffle:true,timed:false,minutes:5,liveBoard:false,reviewAnswers:true,status:'open',questions:structuredClone(defaultQuestions),tieQuestions:structuredClone(defaultTies),players:[],rounds:[],championId:null,award:null,createdAt:Date.now()});
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.players)&&Array.isArray(d.questions)&&Array.isArray(d.rounds))return d}catch(e){}return defaults()}
function readSession(){try{return JSON.parse(sessionStorage.getItem(AUTH)||'null')}catch(e){return null}}
function persistSession(){try{sessionStorage.setItem(AUTH,JSON.stringify(session))}catch(e){console.warn('無法儲存登入階段資訊',e)}}
function clearSession(){try{sessionStorage.removeItem(AUTH)}catch(e){}}
let db=load(),session=readSession(),page='home',adminTab='settings',questionIndex=0,currentAnswers=[],currentIds=[],quizKind='main',quizRound=0,deadline=0,ticker=null,showReview=false;
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const save=()=>localStorage.setItem(KEY,JSON.stringify(db));const myPlayer=()=>session?.type==='player'?db.players.find(p=>p.id===session.id):null;
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function nav(p){showReview=false;page=p;window.scrollTo({top:0,behavior:'instant'});render()}
function randomId(){return (globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():'id_'+Date.now()+'_'+Math.random().toString(36).slice(2)}
function activeCount(){return db.players.length}function mainResults(){return [...db.players].filter(p=>p.main?.submitted).sort((a,b)=>b.main.score-a.main.score)}
function tRound(){return db.rounds.at(-1)}
function contenders(){const r=mainResults();if(!r.length)return[];let top=r[0].main.score;return r.filter(p=>p.main.score===top)}
function isRoundEligible(p,r){return !!r?.ids?.includes(p.id)}
function stateLabel(){return({open:'開放報名及作答',closed:'主賽結束',tie:'加賽進行中',finished:'競賽已完成'})[db.status]||'未知'}
function showNotice(){return '<div class="demo-stamp">⚠ 本機展示模式：邀請碼、管理員入口和分數均為前端模擬，無法阻止竄改。請勿用於真實獎品競賽。</div>'}
function render(){clearInterval(ticker);const p=myPlayer();$('who').textContent=session?.type==='admin'?'🛡️ 管理員':p?'👤 '+p.name:'訪客';$('logout').classList.toggle('hidden',!session);document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('app').innerHTML=({home:homeHTML,play:playHTML,board:boardHTML,prize:prizeHTML,admin:adminHTML})[page]();bindPage();}
function homeHTML(){return `<div class="hero"><div class="hero-copy"><div class="eyebrow">INVITE ONLY · THE QUIZ CHALLENGE</div><h1>用你的知識<br><span class="gradient">登上冠軍寶座。</span></h1><div class="lead">一場只屬於受邀者的答題挑戰。相同題目、公平計分、冠軍加賽機制，誰能帶走最後的榮耀？</div><div class="row"><span class="pill good">● ${esc(stateLabel())}</span><span class="tag">🔐 私人邀請制</span></div><div class="actions"><button class="btn" data-go="play">${myPlayer()?'繼續我的競賽':'立即參加競賽'} →</button><button class="btn ghost" data-go="board">查看排行榜</button></div><div class="stats"><div class="stat"><b>${activeCount()}</b><span>已加入玩家</span></div><div class="stat"><b>${Math.min(db.questionCount,db.questions.length)}</b><span>主賽題數</span></div><div class="stat"><b>${db.rounds.length}</b><span>加賽回合</span></div></div></div><div class="card prize-art"><div class="eyebrow">GRAND PRIZE</div><div class="prize-icon">🏆</div><h2>${esc(db.prize)}</h2><p>${esc(db.prizeDescription)}</p></div></div><div class="section-head"><h2>如何贏得冠軍？</h2><span class="pill">3 個簡單步驟</span></div><div class="grid3"><div class="card feature"><div class="emoji">🎟️</div><h3>01｜取得邀請</h3><p>輸入主辦人提供的邀請碼與暱稱，建立參賽身分。</p></div><div class="card feature"><div class="emoji">🧠</div><h3>02｜挑戰題目</h3><p>每答對一題得 1 分；所有參賽者使用相同的主賽題組。</p></div><div class="card feature"><div class="emoji">🥇</div><h3>03｜決出冠軍</h3><p>最高分平手時進入加賽，直到產生唯一冠軍。</p></div></div>`}
function playHTML(){const p=myPlayer();if(session?.type==='admin')return `<div class="panel card"><h2>目前正在使用管理員模式</h2><p class="subtle">請先退出管理員，再以玩家身分參賽。</p><button class="btn secondary" data-go="admin">管理後台</button></div>`;
if(!p)return `<div class="panel"><div class="eyebrow">PLAYER ACCESS</div><h1 class="page-title">加入挑戰</h1><p class="subtle">輸入暱稱與主辦人提供的邀請碼，立即加入競賽。</p><div class="card"><div class="field"><label for="nick">玩家暱稱</label><input id="nick" maxlength="20" autocomplete="nickname" placeholder="例如：智慧小勇士"></div><div class="field"><label for="code">邀請碼</label><input id="code" maxlength="40" placeholder="請輸入邀請碼"><small>請輸入主辦人提供的邀請碼。</small></div><button class="btn" id="join">加入競賽 →</button><div class="notice warn">目前資料只儲存在這台裝置，跨裝置競賽及防重複參賽須待雲端版本啟用。</div></div></div>`;
if(showReview&&p.main&&db.status!=='open')return answerReviewHTML(p);const r=tRound(),eligible=db.status==='tie'&&isRoundEligible(p,r);if(quizViewActive())return quizHTML();let main=p.main,roundResult=r?.results?.[p.id],html=`<div class="panel"><div class="eyebrow">PLAYER DASHBOARD</div><h1 class="page-title">你好，${esc(p.name)} 👋</h1><p class="subtle">${esc(db.name)} · ${esc(stateLabel())}</p><div class="card"><div class="row between"><div><div class="caption">你的主賽成績</div><h2 style="font-size:38px;margin:7px 0">${main?.submitted?main.score+' / '+main.total:'尚未提交'}</h2></div><div class="medal">${db.championId===p.id?'🏆':'🎯'}</div></div>`;
if(!main){if(db.status==='open')html+=`<button id="start-main" class="btn">開始作答 →</button>`;else html+='<div class="notice warn">主賽目前不開放作答。</div>'}
else {html+='<div class="notice success">✅ 主賽已繳交，無法重新作答。</div>';if(db.status!=='open'&&db.reviewAnswers!==false)html+=`<div class="actions"><button class="btn secondary sm" id="review-answers">檢視答題結果與解析 →</button></div>`;}
if(eligible){html+=`<hr class="separator"><h3>⚡ 第 ${r.number} 回合加賽</h3><p class="subtle">你是本回合的入選玩家之一。</p>${roundResult?`<div class="notice success">本回合已完成，得分 ${roundResult.score} / ${roundResult.total}，等待其他玩家。</div>`:`<button class="btn" id="start-tie">開始加賽 →</button>`}`}
if(db.status==='finished')html+=`<div class="notice ${db.championId===p.id?'success':''}">${db.championId===p.id?'🎉 恭喜！你是冠軍！':'🏁 比賽已結束。'} 冠軍：${esc(db.players.find(x=>x.id===db.championId)?.name||'尚未產生')}</div>`;
html+=`<div class="actions"><button class="btn secondary" data-go="board">查看排行榜</button><button class="btn ghost" data-go="prize">獎品資訊</button></div></div></div>`;return html}

function quizViewActive(){return !!currentIds.length&&page==='play'}
function quizHTML(){
 const pool=quizKind==='main'?db.questions:db.tieQuestions;

 <div class="row between"><span class="caption">選擇答案後立即判定，不能更改</span><span class="score-chip">✅ 已答對 ${scoreSoFar} 題</span></div>

 ${answered?`<div class="answer-feedback ${right?'good':'bad'}" role="status">${right?'✓ 答對了！目前累積答對 '+scoreSoFar+' 題。':'✕ 答錯了！正確答案：'+esc(q.options[q.answer])+'。目前累積答對 '+scoreSoFar+' 題。'}</div>`:'<p class="caption">請選擇一個答案，系統會立即顯示結果。</p>'}
 <div class="row between"><span class="caption">${currentAnswers.filter(x=>x!==null).length} / ${currentIds.length} 已回答</span><button class="btn" id="next" ${answered?'':'disabled'}>${questionIndex===currentIds.length-1?'完成作答 ✓':'下一題 →'}</button></div></div>
 <div class="notice warn">本機展示模式會立即公開正確答案，正式競賽可能造成題目外洩，建議上線時改為賽後公布。</div></div>`;

function clock(s){return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`}
function begin(kind){const p=myPlayer();if(!p)return;if(kind==='main'&&(p.main||db.status!=='open'))return;const r=tRound();if(kind==='tie'&&(!r||db.status!=='tie'||!r.ids.includes(p.id)||r.results[p.id]))return;quizKind=kind;quizRound=r?.number||0;const pool=kind==='main'?db.questions:db.tieQuestions;const n=Math.min(kind==='main'?db.questionCount:db.tieCount,pool.length);const sample=kind==='tie'?r.questionIds:pool.slice(0,n).map(q=>q.id);currentIds=[...sample];if(db.shuffle&&kind==='main')shuffle(currentIds);currentAnswers=Array(currentIds.length).fill(null);questionIndex=0;deadline=db.timed?Date.now()+db.minutes*60*1000:0;render()}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function submitQuiz(auto=false){const p=myPlayer();if(!p||!currentIds.length)return;if(!auto&&currentAnswers.some(a=>a===null)&&!confirm('仍有題目未作答，確定提交嗎？'))return;const pool=quizKind==='main'?db.questions:db.tieQuestions;const score=currentIds.reduce((n,id,i)=>n+(pool.find(q=>q.id===id)?.answer===currentAnswers[i]?1:0),0);const rec={score,total:currentIds.length,submitted:Date.now(),answers:currentIds.map((id,i)=>({id,choice:currentAnswers[i]}))};if(quizKind==='main'){if(p.main||db.status!=='open')return;p.main=rec}else{const r=tRound();if(!r||db.status!=='tie'||r.number!==quizRound||!r.ids.includes(p.id)||r.results[p.id])return;r.results[p.id]=rec}currentIds=[];currentAnswers=[];deadline=0;save();toast(`提交成功！${score} / ${rec.total} 分`);render()}
function boardHTML(){const all=[...db.players].sort((a,b)=>(b.main?.score??-1)-(a.main?.score??-1)),show=db.status!=='open'||db.liveBoard;return `<div class="panel wide"><div class="row between"><div><div class="eyebrow">LEADERBOARD</div><h1 class="page-title">榮耀排行榜</h1><p class="subtle">${esc(stateLabel())} · ${show?'主賽成績公開':'主賽成績於結束後公布'}</p></div><span class="pill ${db.status==='tie'?'warn':'good'}">${db.status==='tie'?'⚡ 加賽中':db.status==='finished'?'🏆 已決出冠軍':'● '+esc(stateLabel())}</span></div><div class="card"><div class="table-wrap"><table class="leaderboard"><thead><tr><th>排名</th><th>玩家</th><th>主賽成績</th><th>加賽</th><th>比賽狀態</th></tr></thead><tbody>${all.length?all.map((p,i)=>{const round=tRound();return `<tr><td><span class="rank ${i===0&&show?'first':''}">${show&&p.main?i+1:'—'}</span></td><td><strong>${esc(p.name)}</strong> ${db.championId===p.id?'👑':''}</td><td>${show&&p.main?p.main.score+' / '+p.main.total:p.main?'🔒 已提交':'—'}</td><td>${show&&round?.results[p.id]?round.results[p.id].score+' / '+round.results[p.id].total:isRoundEligible(p,round)?'待加賽':'—'}</td><td><span class="pill ${db.championId===p.id?'good':''}">${db.championId===p.id?'🏆 冠軍':p.main?'已完成主賽':'尚未作答'}</span></td></tr>`}).join(''):`<tr><td colspan="5" class="empty">目前還沒有玩家，快來成為第一位挑戰者！</td></tr>`}</tbody></table></div>${db.status==='tie'?'<div class="notice warn">⚡ 主賽最高分平手，目前正在進行加賽；主賽名次不代表最終冠軍。</div>':''}</div></div>`}
function prizeHTML(){const champion=db.players.find(p=>p.id===db.championId),isWinner=champion&&myPlayer()?.id===champion.id;return `<div class="panel"><div class="eyebrow">CHAMPION REWARD</div><h1 class="page-title">冠軍獎品中心</h1><div class="card prize-art" style="min-height:260px"><div class="prize-icon" style="font-size:90px">🎁</div><h2>${esc(db.prize)}</h2><p>${esc(db.prizeDescription)}</p></div><div class="card" style="margin-top:18px"><div class="row between"><div><div class="caption">最終冠軍</div><h2>${champion?'👑 '+esc(champion.name):'尚未決出'}</h2></div><span class="pill ${champion?'good':'warn'}">${champion?'比賽已完成':'等待結果'}</span></div>${isWinner?`<div class="notice success">🎉 恭喜奪冠！你的示範獎品碼：<strong>${esc(db.award?.demoCode||'尚未產生')}</strong><br><small>僅為本機展示碼，無法兌換任何獎品。</small></div>`:champion?'<p class="subtle">獎品僅提供冠軍領取；目前僅展示狀態。</p>':'<p class="subtle">在主賽與必要加賽完成之後，這裡會公布最終冠軍。</p>'}<p class="caption">🔐 正式版需要伺服器驗證冠軍資格，才能安全顯示或寄送真實兌換碼。</p></div></div>`}

function bindAdmin(){if($('admin-login-form'))$('admin-login-form').onsubmit=e=>{e.preventDefault();if(Date.now()<adminBlockedUntil)return toast('嘗試次數過多，請稍後再試');const input=$('admin-password').value;try{const ok=localAdminPasswordValid(input);$('admin-password').value='';if(!ok){failedAdminAttempts++;if(failedAdminAttempts>=5){adminBlockedUntil=Date.now()+30000;failedAdminAttempts=0;return toast('錯誤次數過多，請 30 秒後再試')}return toast('管理員密碼不正確')}failedAdminAttempts=0;session={type:'admin'};persistSession();toast('管理員登入成功');render()}catch(err){toast('登入時發生錯誤，請開啟瀏覽器主控台查看詳細資訊')}};document.querySelectorAll('[data-tab]').forEach(x=>x.onclick=()=>{adminTab=x.dataset.tab;render()});if($('save-settings'))$('save-settings').onclick=()=>{const cnt=+$('s-count').value,tie=+$('s-tie').value,min=+$('s-min').value;if(!Number.isInteger(cnt)||cnt<1||cnt>db.questions.length||!Number.isInteger(tie)||tie<1||tie>db.tieQuestions.length||!Number.isInteger(min)||min<1||min>180)return toast('請輸入有效的題數與時間');if(!$('s-name').value.trim())return toast('競賽名稱不可空白');db.name=$('s-name').value.trim();db.invite=INVITE_CODE;db.questionCount=cnt;db.tieCount=tie;db.minutes=min;db.timed=$('s-time').checked;db.shuffle=$('s-shuffle').checked;db.liveBoard=$('s-live').checked;db.reviewAnswers=$('s-review').checked;save();toast('設定已儲存');render()};if($('q-pool')){const pool=$('q-pool');pool.onchange=()=>{renderQuestionItems();clearQuestionForm()};$('q-type').onchange=adaptQuestionType;$('q-save').onclick=saveQuestion;$('q-clear').onclick=clearQuestionForm;renderQuestionItems()}document.querySelectorAll('[data-remove-player]').forEach(x=>x.onclick=()=>{if(db.status!=='open')return toast('比賽結束前不可刪除玩家；請先重設資料');if(!confirm('確定刪除這位玩家？'))return;db.players=db.players.filter(p=>p.id!==x.dataset.removePlayer);save();render()});if($('close-main'))$('close-main').onclick=closeMain;if($('resolve-tie'))$('resolve-tie').onclick=resolveTie;if($('reset-results'))$('reset-results').onclick=()=>{if(!confirm('確定清除所有玩家與競賽成績？'))return;db.players=[];db.rounds=[];db.status='open';db.championId=null;db.award=null;save();render()};if($('reset-all'))$('reset-all').onclick=()=>{if(!confirm('確定還原所有預設設定、題庫和成績？'))return;db=defaults();save();render()};if($('save-reward'))$('save-reward').onclick=()=>{db.prize=$('r-name').value.trim()||'未命名獎品';db.prizeDescription=$('r-desc').value.trim();save();toast('獎品資訊已更新');render()}}
function selectedPool(){return $('q-pool').value==='main'?db.questions:db.tieQuestions}
function renderQuestionItems(){const pool=selectedPool();$('question-items').innerHTML=pool.map((q,i)=>`<div class="item row between"><div style="flex:1;min-width:160px"><strong>${i+1}. ${esc(q.text)}</strong><div class="small">${q.type==='tf'?'是非題':q.type==='image'?'圖片題':'四選一'} · 答案：${esc(q.options[q.answer])}</div></div><div class="table-actions"><button class="btn secondary sm" data-edit-q="${esc(q.id)}">編輯</button><button class="btn danger sm" data-delete-q="${esc(q.id)}">刪除</button></div></div>`).join('');document.querySelectorAll('[data-edit-q]').forEach(b=>b.onclick=()=>editQuestion(b.dataset.editQ));document.querySelectorAll('[data-delete-q]').forEach(b=>b.onclick=()=>{if(db.players.some(p=>p.main)||db.rounds.length)return toast('已有人提交作答，請先重設競賽紀錄');if(pool.length<=1)return toast('題庫至少需保留一題');if(!confirm('確定刪除此題？'))return;const ix=pool.findIndex(q=>q.id===b.dataset.deleteQ);if(ix<0)return;pool.splice(ix,1);db.questionCount=Math.min(db.questionCount,db.questions.length);db.tieCount=Math.min(db.tieCount,db.tieQuestions.length);save();renderQuestionItems()})}
function adaptQuestionType(){const tf=$('q-type').value==='tf';$('q-options').classList.toggle('hidden',tf);$('q-img-wrap').classList.toggle('hidden',$('q-type').value!=='image');$('q-answer').innerHTML=tf?'<option value="0">正確</option><option value="1">錯誤</option>':[0,1,2,3].map(i=>`<option value="${i}">${String.fromCharCode(65+i)}</option>`).join('')}
function clearQuestionForm(){$('q-edit-id').value='';$('q-text').value='';$('q-image').value='';$('q-type').value='choice';for(let i=0;i<4;i++)$('q-o'+i).value='';adaptQuestionType();$('q-form-title').textContent='新增題目'}
function editQuestion(id){const q=selectedPool().find(x=>x.id===id);if(!q)return;$('q-edit-id').value=q.id;$('q-type').value=q.type;$('q-text').value=q.text;$('q-image').value=q.image||'';adaptQuestionType();q.options.forEach((v,i)=>{if($('q-o'+i))$('q-o'+i).value=v});$('q-answer').value=q.answer;$('q-form-title').textContent='編輯題目';$('q-text').scrollIntoView({behavior:'smooth',block:'center'})}
function saveQuestion(){if(db.players.some(p=>p.main)||db.rounds.length)return toast('已有玩家提交，請先重設競賽紀錄再修改題庫');const type=$('q-type').value,text=$('q-text').value.trim(),image=$('q-image').value.trim(),opts=type==='tf'?['正確','錯誤']:[0,1,2,3].map(i=>$('q-o'+i).value.trim());if(!text||opts.some(x=>!x))return toast('題目和選項不可空白');if(type==='image'&&!/^https:\/\/.+/i.test(image))return toast('圖片題請填入有效 HTTPS 圖片網址');const pool=selectedPool(),id=$('q-edit-id').value||randomId(),q={id,type,text,options:opts,answer:+$('q-answer').value,...(type==='image'?{image}:{})},idx=pool.findIndex(x=>x.id===id);if(idx>=0)pool[idx]=q;else pool.push(q);save();renderQuestionItems();clearQuestionForm();toast('題目已儲存')}
function makeDemoAward(){if(!db.championId||db.award)return;const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let value='DEMO-';if(globalThis.crypto?.getRandomValues){const nums=new Uint32Array(8);crypto.getRandomValues(nums);value+=Array.from(nums,n=>alphabet[n%alphabet.length]).join('')}else value+='LOCAL-'+Date.now().toString(36).toUpperCase();db.award={demoCode:value,issuedAt:Date.now(),winnerId:db.championId,real:false}}
function closeMain(){if(db.status!=='open')return;const results=mainResults();if(!results.length)return toast('至少一位玩家完成後才能結算');if(!confirm('結束主賽後，未提交的玩家將無法作答。確定嗎？'))return;db.status='closed';const ties=contenders();if(ties.length===1){db.championId=ties[0].id;db.status='finished';makeDemoAward()}else startTieRound(ties.map(x=>x.id));save();render()}
function startTieRound(ids){const used=new Set(db.rounds.flatMap(x=>x.questionIds));let available=db.tieQuestions.filter(q=>!used.has(q.id));if(available.length<db.tieCount){db.status='closed';toast('加賽題庫不足！請先擴充未使用的加賽題目再開始新回合。');return false}db.rounds.push({number:db.rounds.length+1,ids,questionIds:shuffle(available.map(q=>q.id)).slice(0,db.tieCount),results:{},done:false});db.status='tie';return true}
function resolveTie(){const r=tRound();if(db.status!=='tie'||!r||!r.ids.every(id=>r.results[id]))return;const max=Math.max(...r.ids.map(id=>r.results[id].score));const top=r.ids.filter(id=>r.results[id].score===max);r.done=true;if(top.length===1){db.championId=top[0];db.status='finished';makeDemoAward();toast('成功決出唯一冠軍！')}else{if(!startTieRound(top))toast('仍然平手：加賽題庫已用完，請新增題目後再進行下一回合');else toast('再次平手！已建立下一回合加賽')}save();render()}
$('logout').onclick=()=>{session=null;clearSession();currentIds=[];deadline=0;nav('home')};document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{if(currentIds.length&&!confirm('離開作答頁面？此分頁暫存的答案將保留，但重新整理可能遺失。'))return;nav(b.dataset.page)});render();
</script>
